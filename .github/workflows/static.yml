name: Deploy React Vite Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Build Runtime Node
        uses: actions/setup-node@v4
        with:
          node-index: 20
          cache: 'npm'

      - name: Install Architecture Dependencies
        run: npm ci

      - name: Compile and Bundle React Production Assets
        run: npm run build

      - name: Configure Cloud Hosting Infrastructure
        uses: actions/configure-pages@v4

      - name: Package Compiled Build Assets Folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy Live Asset Pipeline to Pages
        id: deployment
        uses: actions/deploy-pages@v4
